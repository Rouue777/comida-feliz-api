services:
  postgres:
    image: postgres:16-alpine
    container_name: comida-feliz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: restaurante
      POSTGRES_DB: restaurante

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: comida-feliz-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://restaurante:restaurante@postgres:5432/restaurante
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "3000:3000"

    depends_on:
      - postgres

  web:
    build:
      context: ../comida-feliz-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000

    container_name: comida-feliz-web
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000

    ports:
      - "3001:3000"

    depends_on:
      - api

volumes:
  postgres_data: