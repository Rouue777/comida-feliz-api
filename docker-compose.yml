services:
  postgres:
    image: postgres:16-alpine
    container_name: comida-feliz-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: restaurante
      POSTGRES_PASSWORD: restaurante
      POSTGRES_DB: restaurante

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: comida-feliz-api
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      DATABASE_URL: postgresql://restaurante:restaurante@postgres:5432/restaurante
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - postgres

volumes:
  postgres_data: